name: Test build

# Builds a debug-signed APK and publishes it under the "test-build" release,
# so it can be downloaded from a phone browser.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Lint (API level check, informational)
        continue-on-error: true
        run: |
          ./gradlew lintDebug || true
          grep -h -A3 -E 'Error:|\[NewApi\]' $(find app/build -name 'lint-results-debug.txt') || echo "No lint errors"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ip-cam-test.apk

      - name: Publish to test-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build
          prerelease: true
          body: |
            Test APK (debug-signed) built from ${{ github.sha }}.
            Requires Android 10 or newer. If an older test build is installed, uninstall it first.
          files: ip-cam-test.apk
